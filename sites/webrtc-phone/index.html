<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MikoPBX</title>
</head>
<body>
<script>
/*
 * Совместимость со старыми версиями виджета amoCRM (до удаления панели управления вызовами).
 *
 * Старый виджет загружает эту страницу и пишет её в iframe через document.write,
 * поэтому iframe работает в origin amoCRM. Страница невидима и оставляет виджету
 * click-to-call, автооткрытие карточки и сохранение настроек.
 *
 * Протокол старого виджета: iframe -> 'init-done', виджет -> {action:'connect', data: settings},
 * дальше команды 'callback' и 'saveSettings'. В виджет уходят 'openCardEntities' и 'error'.
 *
 * ВАЖНО: старый виджет глобально заменяет в этом HTML подстроки с атрибутами
 * href, src и data-main (знак "=" и кавычка). Такие подстроки здесь писать нельзя.
 */
(function () {
    var STYLE_ID = 'mikopbx-legacy-shim-style';
    try {
        var doc = window.parent.document;
        if (!doc.getElementById(STYLE_ID)) {
            var st = doc.createElement('style');
            st.id = STYLE_ID;
            // !important в таблице стилей сильнее inline display, который ставит jQuery .show().
            st.textContent = '#miko-pbx-phone,#miko-pbx-toggle-tab{display:none!important}';
            doc.head.appendChild(st);
        }
    } catch (e) {}

    var host = window.mikoPbxHost || '';
    if (!host) {
        try { host = window.frameElement.getAttribute('title') || ''; } catch (e) {}
    }
    if (!host) {
        return;
    }
    var proto   = window.location.protocol === 'http:' ? 'http:' : 'https:';
    var apiBase = proto + '//' + host + '/pbxcore/api/amo-crm/v1/';
    var cfg     = null;
    var ws      = null;
    var delay   = 1000;
    var downSince = 0;
    var lastAlert = 0;
    var authFailed = false;
    var ALERT_INTERVAL = 300000;

    function toParent(msg) {
        msg.pbxHost = host;
        window.parent.postMessage(JSON.stringify(msg), '*');
    }

    function alertError(code) {
        var now = Date.now();
        if (now - lastAlert < ALERT_INTERVAL) {
            return;
        }
        lastAlert = now;
        toParent({action: 'error', code: code});
    }

    function encode(data) {
        var parts = [];
        for (var k in data) {
            if (!Object.prototype.hasOwnProperty.call(data, k) || data[k] === undefined || data[k] === null) {
                continue;
            }
            var v = data[k];
            if (typeof v === 'object') {
                v = JSON.stringify(v);
            }
            parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
        }
        return parts.join('&');
    }

    function post(path, data) {
        data.token = cfg.token;
        return fetch(apiBase + path, {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'},
            body: encode(data)
        }).then(function (r) {
            if (r.status === 403) {
                alertError('errorAuthAPI');
            }
        }).catch(function () {
            alertError('errorLoadFrame');
        });
    }

    function checkAuth() {
        fetch(apiBase + 'panel-enable?token=' + encodeURIComponent(cfg.token))
            .then(function (r) {
                if (r.status === 403) {
                    authFailed = true;
                    alertError('errorAuthAPI');
                }
            })
            .catch(function () {});
    }

    // Одна карточка на звонок на все вкладки amoCRM. Видимая вкладка открывает сразу; если видимой
    // нет, карточка откладывается и открывается во вкладке, на которую переключится пользователь
    // (не позже 5 минут). Ключи и формат — общие с widget/js/mpbx-connector.js.
    var CARD_DONE_PREFIX = 'mikopbx:open-card:';
    var CARD_DONE_TTL    = 600000;
    var CARD_PENDING_KEY = 'mikopbx:pending-card';
    var CARD_PENDING_TTL = 300000;
    var CARD_HIDDEN_WAIT = 400;

    function pageHidden() {
        try { return !!window.parent.document.hidden; } catch (e) { return false; }
    }

    function isCardDone(key, now) {
        return now - parseInt(localStorage.getItem(CARD_DONE_PREFIX + key) || '0', 10) < CARD_DONE_TTL;
    }

    function markCardDone(key, now) {
        localStorage.setItem(CARD_DONE_PREFIX + key, String(now));
        for (var i = localStorage.length - 1; i >= 0; i--) {
            var k = localStorage.key(i);
            if (k && k.indexOf(CARD_DONE_PREFIX) === 0
                && now - parseInt(localStorage.getItem(k) || '0', 10) > CARD_DONE_TTL) {
                localStorage.removeItem(k);
            }
        }
    }

    function readPendingCard() {
        var card;
        try { card = JSON.parse(localStorage.getItem(CARD_PENDING_KEY) || 'null'); } catch (e) { return null; }
        if (!card || typeof card.key !== 'string' || typeof card.ts !== 'number'
            || !/^\d+$/.test(String(card.id)) || ['leads', 'contacts', 'companies'].indexOf(card.entity) < 0) {
            return null;
        }
        return card;
    }

    // Старый виджет открывает только контакт или сделку (gotoContact(client, lead)).
    function sendCard(card) {
        toParent({action: 'openCardEntities', data: {
            number:      card.phone,
            responsible: card.responsible,
            client:      card.entity === 'contacts' ? String(card.id) : '',
            lead:        card.entity === 'leads' ? String(card.id) : ''
        }});
    }

    // Сначала отправка в виджет: если родительское окно уже недоступно (документ iframe
    // переписан), карточка не должна оказаться отмеченной открытой.
    function openCardHere(card) {
        sendCard(card);
        try {
            markCardDone(card.key, Date.now());
            var pending = readPendingCard();
            if (pending && pending.key === card.key) {
                localStorage.removeItem(CARD_PENDING_KEY);
            }
        } catch (e) {}
    }

    function showCard(card) {
        // 'open' | 'skip' | 'wait'; ошибки localStorage -> 'open' без дедупликации.
        var decide = function (final) {
            try {
                var now = Date.now();
                if (isCardDone(card.key, now)) {
                    return 'skip';
                }
                if (!pageHidden()) {
                    return 'open';
                }
                if (final) {
                    card.ts = now;
                    localStorage.setItem(CARD_PENDING_KEY, JSON.stringify(card));
                }
                return 'wait';
            } catch (e) {
                return 'open';
            }
        };
        var result = decide(false);
        if (result === 'open') {
            openCardHere(card);
        } else if (result === 'wait') {
            setTimeout(function () {
                if (decide(true) === 'open') {
                    openCardHere(card);
                }
            }, CARD_HIDDEN_WAIT);
        }
    }

    function openPendingCard() {
        if (cfg === null || pageHidden()) {
            return;
        }
        try {
            var card = readPendingCard();
            if (!card || card.entity === 'companies') {
                // Карточку компании старый виджет не откроет — оставляем её вкладке с новым виджетом.
                return;
            }
            var now = Date.now();
            if (now - card.ts > CARD_PENDING_TTL || isCardDone(card.key, now)) {
                localStorage.removeItem(CARD_PENDING_KEY);
                return;
            }
            if (String(card.responsible) !== String(cfg.currentUser)) {
                return;
            }
            openCardHere(card);
        } catch (e) {}
    }

    // Отложенную карточку открывает переключение в вкладку (visibilitychange) или её запись
    // другой вкладкой, когда эта уже видима (storage). Не при загрузке: открытая пользователем
    // страница важнее. Обработчики хранятся в родительском окне: старый виджет может переписать
    // документ iframe, и обработчики прежнего документа нужно снять.
    function watchPendingCards() {
        try {
            var p = window.parent;
            var prev = p.__mikopbxShimCards;
            if (prev) {
                p.document.removeEventListener('visibilitychange', prev.visible);
                p.removeEventListener('storage', prev.storage);
            }
            var handlers = {
                visible: function () { openPendingCard(); },
                storage: function (event) {
                    if (event.key === CARD_PENDING_KEY && event.newValue) {
                        openPendingCard();
                    }
                }
            };
            p.document.addEventListener('visibilitychange', handlers.visible);
            p.addEventListener('storage', handlers.storage);
            p.__mikopbxShimCards = handlers;
        } catch (e) {}
    }

    function onPbxMessage(event) {
        var d;
        try { d = JSON.parse(event.data); } catch (e) { return; }
        if (!d || d.action !== 'open-card' || !d.data) {
            return;
        }
        var c = d.data;
        // Чужой звонок старый виджет отбросит сам, но отложенным он вытеснил бы карточку этого пользователя.
        if (String(c.responsible) !== String(cfg.currentUser)) {
            return;
        }
        var entity = '', id = '';
        if (/^\d+$/.test(String(c.lead || ''))) {
            entity = 'leads'; id = String(c.lead);
        } else if (/^\d+$/.test(String(c.client || ''))) {
            entity = 'contacts'; id = String(c.client);
        } else {
            return;
        }
        showCard({
            key:         String(c.id || c.uniq || (c.phone + ':' + c.responsible)),
            entity:      entity,
            id:          id,
            responsible: c.responsible,
            phone:       String(c.phone || '')
        });
    }

    function connectWs() {
        if (ws) {
            ws.onclose = null;
            try { ws.close(); } catch (e) {}
        }
        var wsProto = proto === 'http:' ? 'ws:' : 'wss:';
        ws = new WebSocket(wsProto + '//' + host + '/pbxcore/api/nchan/sub/pbx-events?token=' + encodeURIComponent(cfg.token));
        ws.onopen = function () {
            delay = 1000;
            downSince = 0;
        };
        ws.onmessage = onPbxMessage;
        ws.onclose = function () {
            var now = Date.now();
            if (downSince === 0) {
                downSince = now;
                checkAuth();
            } else if (!authFailed && now - downSince > 60000) {
                alertError('errorAPITimeOut');
            }
            setTimeout(connectWs, delay);
            delay = Math.min(delay * 2, 60000);
        };
    }

    window.addEventListener('message', function (event) {
        if (event.source !== window.parent) {
            return;
        }
        var m = event.data;
        if (typeof m === 'string') {
            try { m = JSON.parse(m); } catch (e) { return; }
        }
        if (!m || typeof m !== 'object' || !m.action) {
            return;
        }
        if (m.action === 'connect') {
            if (cfg === null && m.data && m.data.token) {
                cfg = m.data;
                // Карточку открывает только ответственный с внутренним номером: без номера сокет не нужен.
                if (String(cfg.currentPhone || '').trim() !== '') {
                    connectWs();
                    watchPendingCards();
                }
            }
        } else if (cfg !== null && m.action === 'callback') {
            post('callback', {
                'action':      'callback',
                'number':      m.number,
                'user-number': m['user-number'] || cfg.currentPhone,
                'user-id':     m['user-id'] || cfg.currentUser
            });
        } else if (cfg !== null && m.action === 'saveSettings') {
            post('change-settings', {
                'action':   'saveSettings',
                'users':    m.users,
                'portalId': m.portalId
            });
        }
    });

    toParent({action: 'init-done'});
})();
</script>
</body>
</html>
